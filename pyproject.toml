[project]
name = "pilgrim"
version = "0.1.0"
description = "Project for automated instrument control and testing procedures"
readme = "README.md"
authors = [
    { name = "Huy Vuu", email = "Huythanh.Vuu@infineon.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pymeasure>=0.16.0",
]

[project.scripts]
pilgrim = "pilgrim:main"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.1",
]
tests = [
    "pytest>=3.3.0",
    "pytest-cov>=4.1.0",
    "pyvisa-sim>=0.4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "PERF", # perflint
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "warning"
reportDeprecated = "warning"
